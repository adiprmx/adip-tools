<!-- Skeleton statis beranda (S-U1 v6.22.0, F-03): tampil sebelum JS
     jalan (F-03: muat pertama halaman kosong total). Isinya sapaan
     + H1 + kotak search tiruan, tanpa JS; home() mengganti seluruh
     isi #app saat render (app.innerHTML). Kelas yang dipakai sama
     dengan hero asli (.hero/.hi/.hsearch) supaya tidak ada lompatan
     tata letak saat hero asli masuk; animasi masuknya dari CSS
     (hi-in/hs-in) dan jalan tanpa JS. aria-hidden karena ini
     placeholder sementara, bukan konten. Bila modul JS gagal dimuat
     sama sekali, skeleton ini tetap terlihat (lebih baik dari halaman
     putih) dan pesan error boot di route() yang mengambil alih bila
     JS sempat jalan tapi render gagal. -->
<main id="app" tabindex="-1">
  <div class="wrap view" aria-hidden="true">
    <section class="hero">
      <p class="hi">Selamat datang</p>
      <h1>Butuh apa?</h1>
      <div class="hsearch glass">
        <span class="glyph" aria-hidden="true">⌕</span>
        <span class="sk-q">Cari tools...</span>
      </div>
    </section>
  </div>
  <noscript><p style="font-size:14px;line-height:1.6;color:var(--mut);margin:16px 2px 0">Nyalakan JavaScript untuk memakai ADIP Tools.</p></noscript>
</main>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/fx.js"></script>
<!-- S-FIXUP F13 (v6.22.0): pengawas boot. Skrip klasik (BUKAN modul)
     — jalan walau pemuatan modul gagal total. Bila 10 dtk sesudah
     parse, skeleton statis masih ada di #app (aplikasi belum boot),
     tampilkan pesan + tombol muat ulang. Gaya inline: CSS pun bisa
     saja gagal dimuat. Boot normal / renderBootError mengganti isi
     #app, jadi pesan ini hilang sendiri bila aplikasi akhirnya jalan. -->
<script>
setTimeout(function () {
  var app = document.getElementById('app');
  if (!app) return;
  /* Skeleton statis = .wrap[aria-hidden="true"] langsung di #app.
     route() / renderBootError mengganti seluruh isi #app, jadi
     kehadirannya berarti boot belum pernah jalan. */
  if (!app.querySelector(':scope > .wrap[aria-hidden="true"]')) return;
  var box = document.createElement('div');
  box.setAttribute('data-boot-watchdog', '');
  box.style.cssText = 'margin:24px 16px 0;padding:16px;border:1px solid #3a332e;border-radius:12px;background:#1e1a17;color:#f4f1ed;font-family:system-ui,-apple-system,sans-serif;text-align:center';
  box.innerHTML = '<p style="margin:0 0 8px;font-size:16px;font-weight:700">Gagal memuat.</p>'
    + '<p style="margin:0 0 16px;font-size:14px;line-height:1.5;color:#b8b0a8">Periksa koneksi internet kamu, lalu coba lagi.</p>'
    + '<button type="button" style="min-height:44px;padding:0 20px;border:0;border-radius:10px;background:#ff6f61;color:#161311;font-size:15px;font-weight:700;cursor:pointer">Coba lagi</button>';
  box.querySelector('button').addEventListener('click', function () { location.reload(); });
  app.appendChild(box);
}, 10000);
</script>
